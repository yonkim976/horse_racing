{% set seo = search_metadata(request, private=privacy_noindex|default(false)) %}
<link rel="stylesheet" href="{{ url_for('static', path='/css/seo-summary.css') }}?v=1">
<meta name="robots" content="{{ seo.robots }}">
<link rel="canonical" href="{{ seo.canonical }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="https://mapilog.xyz/static/images/brand/mapilog-favicon.png">
<meta property="og:image:width" content="224">
<meta property="og:image:height" content="224">
<meta property="og:image:alt" content="마필로그 Mapilog">
<meta name="twitter:image" content="https://mapilog.xyz/static/images/brand/mapilog-favicon.png">
<script type="application/ld+json">{{ {
  '@context': 'https://schema.org',
  '@graph': [
    {'@type': 'WebSite', '@id': 'https://mapilog.xyz/#website',
     'url': 'https://mapilog.xyz/', 'name': '마필로그', 'alternateName': 'Mapilog',
     'inLanguage': 'ko'},
    {'@type': 'WebPage', '@id': seo.canonical ~ '#webpage', 'url': seo.canonical,
     'name': seo_title, 'inLanguage': 'ko',
     'isPartOf': {'@id': 'https://mapilog.xyz/#website'}}
  ]
}|tojson }}</script>
