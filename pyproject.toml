[project]
name = "horse-racing"
version = "0.1.0"
description = "Korean horse-racing data collection and analytics platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "beautifulsoup4>=4.12,<5",
    "duckdb>=1.2,<2",
    "httpx>=0.28,<1",
    "lxml>=5,<7",
    "polars>=1.20,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9,<10",
]

[project.scripts]
horse-racing = "horse_racing.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
web = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horse_racing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

