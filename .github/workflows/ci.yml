name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --group web

      - name: Lint application code
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q -p no:cacheprovider

      - name: JavaScript XSS regression tests
        run: |
          for test in tests/*.test.cjs; do
            node "$test"
          done
