substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: mapilog
  _SERVICE_NAME: mapilog

steps:
  - id: Test
    name: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        uv sync --locked --group dev --group web
        uv run ruff check src/horse_racing/web
        uv run pytest -q -p no:cacheprovider \
          tests/test_dashboard.py tests/test_distance_page.py tests/test_race_analysis.py \
          tests/test_racecourse.py tests/test_web_request_policy.py \
          tests/test_web_security.py tests/test_web_security_integration.py

  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - .

  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID
      - --labels=managed-by=cloud-build,build-id=$BUILD_ID
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
